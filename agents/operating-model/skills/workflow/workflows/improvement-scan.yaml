document:
  dsl: 1.1.0
  namespace: org
  name: improvement-scan
  version: 0.1.0
  title: Improvement scan
  summary: Scan the code, the metrics and the ledger for one improvement, then file it as a work item that starts the feature workflow.
schedule:
  on:
    one:
      with:
        type: org.scan-requested
do:
  - scan:
      run:
        shell: { command: agent-run, arguments: [] }
      timeout:
        after: { minutes: 30 }
      metadata:
        org:
          by: model
          role: improver
          brief: briefs/sw/scan.md
          metrics: [proposals-accepted]
          acceptance:
            - rubric: criteria/sw/scan.md
              judge: lead
  - file-work-item:
      emit:
        event:
          with:
            type: org.work-item-ready
            source: improvement-scan
            data: { subject: improvement found by the scan }
      metadata:
        org:
          by: code
          role: ci
          metrics: [escalations]
          acceptance:
            - check: event-names-its-subject
