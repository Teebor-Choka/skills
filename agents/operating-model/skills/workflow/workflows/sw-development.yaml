document:
  dsl: 1.1.0
  namespace: org
  name: sw-development
  version: 0.3.0
  title: Software development, outer cycle (ATDD)
  summary: One work item from an idea to a merged, deployed, reported change. Feasibility, layer and system acceptance send work back to the layer that caused the failure. The inner cycle is tdd-unit.
  metadata:
    org:
      policy:
        [
          work.tracker,
          vcs.remote,
          vcs.default-branch,
          comms.channel,
          report.sink,
        ]
schedule:
  on:
    one:
      with:
        type: org.work-item-ready
do:
  - align:
      run:
        shell: { command: agent-run, arguments: [] }
      metadata:
        org:
          by: model
          role: pm
          brief: briefs/sw/align.md
          metrics: [escalations]
          acceptance:
            - rubric: criteria/sw/brief.md
              judge: lead
  - spec-cycle:
      for: { each: spec-round, in: [1, 2, 3] }
      while: ${ $accepted["spec-cycle/spec"] != true or $accepted["spec-cycle/design-cycle/feasibility"] == false or ($accepted["spec-cycle/design-cycle/system-run"] == false and $context.system_fault == "spec") }
      do:
        - spec:
            run:
              shell: { command: agent-run, arguments: [] }
            output:
              schema:
                format: json
                resource: { endpoint: schemas/org/item.json }
            metadata:
              org:
                by: model
                role: lead
                brief: briefs/sw/spec.md
                floor: true
                metrics: [spec-rework]
                acceptance:
                  - check: spec-check
                  - rubric: criteria/sw/spec.md
                    judge: reviewer
        - acceptance-tests:
            run:
              shell: { command: agent-run, arguments: [] }
            metadata:
              org:
                by: model
                role: tester
                brief: briefs/sw/acceptance-tests.md
                metrics: [acceptance-coverage]
                acceptance:
                  - check: spec-coverage
                  - rubric: criteria/sw/acceptance-tests.md
                    judge: reviewer
        - acceptance-red:
            run:
              shell: { command: tdd-evidence, arguments: [acceptance, red] }
            metadata:
              org:
                by: code
                role: ci
                metrics: [red-for-wrong-reason]
                acceptance:
                  - check: every-acceptance-test-fails-on-an-assertion
        - design-cycle:
            for: { each: design-round, in: [1, 2, 3] }
            while: ${ $accepted["spec-cycle/design-cycle/feasibility"] == null or ($accepted["spec-cycle/design-cycle/feasibility"] == true and (($accepted["spec-cycle/design-cycle/build-cycle/layer-run"] == false and $context.layer_fault == "design") or ($accepted["spec-cycle/design-cycle/system-run"] == false and $context.system_fault == "design"))) }
            do:
              - design:
                  run:
                    shell: { command: agent-run, arguments: [] }
                  metadata:
                    org:
                      by: model
                      role: architect
                      brief: briefs/sw/design.md
                      metrics: [escalations]
                      acceptance:
                        - rubric: criteria/sw/design.md
                          judge: reviewer
              - feasibility:
                  run:
                    shell:
                      { command: tdd-evidence, arguments: [feasibility, check] }
                  metadata:
                    org:
                      by: code
                      role: ci
                      metrics: [spec-rework]
                      acceptance:
                        - check: feasibility-holds
              - cut:
                  if: ${ $accepted["spec-cycle/design-cycle/feasibility"] == true }
                  run:
                    shell: { command: agent-run, arguments: [] }
                  output:
                    schema:
                      format: json
                      resource: { endpoint: schemas/org/units.json }
                  export:
                    as: "${ $context + . }"
                  metadata:
                    org:
                      by: model
                      role: lead
                      brief: briefs/sw/cut.md
                      metrics: [write-set-collisions]
                      acceptance:
                        - check: write-sets-are-disjoint
              - build-cycle:
                  if: ${ $accepted["spec-cycle/design-cycle/feasibility"] == true }
                  for: { each: build-round, in: [1, 2, 3] }
                  while: ${ $accepted["spec-cycle/design-cycle/build-cycle/layer-run"] == null or ($accepted["spec-cycle/design-cycle/build-cycle/layer-run"] == false and $context.layer_fault == "unit") }
                  do:
                    - units:
                        for: { each: unit, in: "${ $context.units }" }
                        do:
                          - tdd:
                              run:
                                workflow:
                                  namespace: org
                                  name: tdd-unit
                                  version: 0.2.0
                                  input: { unit: "${ $unit }" }
                              metadata:
                                org:
                                  by: code
                                  role: lead
                                  metrics: [escalations]
                                  acceptance:
                                    - check: unit-verdict-is-pass
                    - layer-run:
                        run:
                          shell:
                            { command: tdd-evidence, arguments: [layer, run] }
                        export:
                          as: "${ $context + . }"
                        metadata:
                          org:
                            by: code
                            role: ci
                            metrics: [acceptance-rounds]
                            acceptance:
                              - check: acceptance-suite-green
              - system-run:
                  if: ${ $accepted["spec-cycle/design-cycle/build-cycle/layer-run"] == true }
                  run:
                    shell: { command: tdd-evidence, arguments: [system, run] }
                  export:
                    as: "${ $context + . }"
                  metadata:
                    org:
                      by: code
                      role: ci
                      metrics: [acceptance-rounds]
                      acceptance:
                        - check: acceptance-suite-green
  - not-accepted:
      if: ${ $accepted["spec-cycle/spec"] != true or $accepted["spec-cycle/design-cycle/system-run"] != true }
      raise:
        error:
          type: https://org.example/errors/acceptance-not-met
          status: 409
          title: System acceptance still red after the round bounds
      metadata:
        org: { to: lead }
  - review-cycle:
      for: { each: round, in: [1, 2] }
      while: ${ $accepted["review-cycle/review"] != true }
      do:
        - rework-units:
            if: ${ $round > 1 }
            for: { each: unit, in: "${ $context.units }" }
            do:
              - rework-tdd:
                  run:
                    workflow:
                      namespace: org
                      name: tdd-unit
                      version: 0.2.0
                      input: { unit: "${ $unit }" }
                  metadata:
                    org:
                      by: code
                      role: lead
                      metrics: [escalations]
                      acceptance:
                        - check: unit-verdict-is-pass
        - rework-layer-run:
            if: ${ $round > 1 }
            run:
              shell: { command: tdd-evidence, arguments: [layer, run] }
            metadata:
              org:
                by: code
                role: ci
                metrics: [acceptance-rounds]
                acceptance:
                  - check: acceptance-suite-green
        - review:
            run:
              shell: { command: agent-run, arguments: [--isolated] }
            timeout:
              after: { days: 7 }
            metadata:
              org:
                by: model
                role: reviewer
                brief: briefs/sw/review.md
                floor: true
                metrics: [defects-found-in-review, defects-escaped]
                acceptance:
                  - rubric: criteria/sw/review.md
                    judge: owner
  - not-approved:
      if: ${ $accepted["review-cycle/review"] != true }
      raise:
        error:
          type: https://org.example/errors/review-not-approved
          status: 409
          title: Review not approved after the round bound
      metadata:
        org: { to: owner }
  - merge-gate:
      listen:
        to:
          one:
            with:
              type: org.owner-decided
      timeout:
        after: { days: 2 }
      metadata:
        org:
          by: human
          role: owner
          floor: true
          metrics: [escalations, decision-latency]
          acceptance:
            - human: decision signed and verified
  - merge:
      if: ${ $accepted["merge-gate"] == true }
      run:
        shell:
          { command: merge-change, arguments: [--into, vcs.default-branch] }
      metadata:
        org:
          by: code
          role: ci
          metrics: [lead-time]
          acceptance:
            - check: checks-green-and-gate-approved
  - deploy:
      run:
        shell: { command: agent-run, arguments: [] }
      metadata:
        org:
          by: model
          role: ci
          brief: briefs/sw/deploy.md
          metrics: [lead-time]
          acceptance:
            - rubric: criteria/sw/deploy.md
              judge: lead
  - verify:
      run:
        shell: { command: tdd-evidence, arguments: [deploy, verify] }
      metadata:
        org:
          by: code
          role: ci
          metrics: [defects-escaped]
          acceptance:
            - check: deploy-verified
  - bug-report:
      if: ${ $accepted["verify"] != true }
      emit:
        event:
          with:
            type: org.bug-reported
            source: sw-development
            data: { subject: deploy verification failed }
      metadata:
        org:
          by: code
          role: ci
          metrics: [escalations]
          acceptance:
            - check: event-names-its-subject
  - report:
      emit:
        event:
          with:
            type: org.run-reported
            source: sw-development
      metadata:
        org:
          by: code
          role: ci
          metrics: [report-complete]
          acceptance:
            - check: report-has-every-required-section
  - improve:
      run:
        workflow:
          namespace: org
          name: improve
          version: latest
          input: { run: "${ $workflow.id }" }
      metadata:
        org:
          by: model
          role: improver
          metrics: [proposals-accepted]
          acceptance:
            - check: every-proposal-is-within-its-rung
  - reflect:
      emit:
        event:
          with:
            type: org.lessons-recorded
            source: sw-development
            data: { subject: lessons and metrics of the run }
      metadata:
        org:
          by: code
          role: ci
          metrics: [escalations]
          acceptance:
            - check: event-names-its-subject
